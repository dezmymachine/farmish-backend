      required: [reference, authorizationUrl, price, processingFee, charge, credits]
      properties:
        reference:
          type: string
        authorizationUrl:
          type: string
          format: uri
        price:
          $ref: "#/components/schemas/Money"
        processingFee:
          $ref: "#/components/schemas/Money"
        charge:
          $ref: "#/components/schemas/Money"
        credits:
          type: integer
          format: int32
          minimum: 1
    PromotionBalance:
      type: object
