        "429":
          $ref: "#/components/responses/TooManyRequests"
        "default":
          $ref: "#/components/responses/OrderActionError"
  /v1/orders/{id}/confirm-receipt:
    post:
      tags: [orders]
      operationId: confirmOrderReceipt
      summary: Confirm I received my order
      description: |
        The buyer of the order only, on a shipped or delivered order.
        Confirming completes the order and queues the seller's escrow release.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The completed order, buyer-shaped.
          content:
            application/json:
