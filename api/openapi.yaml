        actorType:
          type: string
          enum: [buyer, seller, admin, system]
        note:
          type: string
        createdAt:
          type: string
          format: date-time
    OrderActionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      description: A free-text reason, recorded in the order's event trail.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ShipOrderRequest:
      type: object
      additionalProperties: false
      description: The tracking reference is optional; omitting it keeps any stored one.
      properties:
        trackingRef:
          type: string
          maxLength: 120
    DisputeOrderRequest:
      type: object
      additionalProperties: false
      required: [reason, description]
      properties:
        reason:
          type: string
          enum: [not_received, not_as_described, damaged, wrong_item, other]
        description:
          type: string
          minLength: 10
          maxLength: 2000
    OrderDetail:
      type: object
      description: |
        One order, shaped by the caller's role. The seller additionally sees
        `recipientName`, `recipientPhone`, `commission` and `sellerNet`; the
        buyer additionally sees `seller` (the public profile) and never sees
        the commission.
      required: [id, checkoutId, buyerId, sellerId, sellerName, status, escrowState, items, subtotal, deliveryFee, base, deliveryMethod, delivery, createdAt, events]
      properties:
        id:
          type: string
          format: uuid
        checkoutId:
          type: string
          format: uuid
        buyerId:
          type: string
          format: uuid
        sellerId:
          type: string
          format: uuid
        sellerName:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        escrowState:
          $ref: "#/components/schemas/EscrowState"
        items:
          type: array
          items:
            $ref: "#/components/schemas/CheckoutQuoteItem"
        subtotal:
          $ref: "#/components/schemas/Money"
        deliveryFee:
          $ref: "#/components/schemas/Money"
        base:
          $ref: "#/components/schemas/Money"
        commission:
          $ref: "#/components/schemas/Money"
          description: The platform's cut. Seller only.
        sellerNet:
          $ref: "#/components/schemas/Money"
          description: The base minus the commission. Seller only.
        deliveryMethod:
          type: string
          enum: [pickup, seller_delivery, courier]
        delivery:
          type: object
          description: Where and to whom the order goes. Seller only.
          properties:
            address:
              type: string
            region:
              type: string
            district:
              type: string
            recipientName:
              type: string
            recipientPhone:
              type: string
            trackingRef:
              type: string
        seller:
          $ref: "#/components/schemas/PublicSeller"
          description: The seller's public profile. Buyer only.
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/OrderEvent"
    Money:
      type: object
      description: An amount of money in the smallest currency unit (pesewas).
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: Integer pesewas. GHS 12.50 is `1250`.
          examples: [1250]
        currency:
          type: string
          enum: [GHS]
    PageMeta:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        total:
          type: integer
          format: int64
          minimum: 0
          description: Total matching items across all pages.
    DisputeStatus:
