          type: string
          format: uuid
        tier:
          $ref: "#/components/schemas/PromotionTier"
    PromotionApplication:
      type: object
      description: |
        One promotion window. A same-tier application queues behind the current
        window; replacement reports whether the old window had time remaining.
      required: [id, listingId, tier, startsAt, endsAt, creditsSpent]
      properties:
        id:
          type: string
          format: uuid
        listingId:
          type: string
          format: uuid
        tier:
          $ref: "#/components/schemas/PromotionTier"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        creditsSpent:
          type: integer
          format: int32
          minimum: 0
        replacedRemaining:
          type: boolean
    PromotionApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PromotionApplication"
