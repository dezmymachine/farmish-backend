      required: [order, buyer, seller, ledgerEntries]
      properties:
        order:
          $ref: "#/components/schemas/OrderDetail"
        buyer:
          $ref: "#/components/schemas/OrderPartyContact"
        seller:
          $ref: "#/components/schemas/OrderPartyContact"
        ledgerEntries:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntryView"
    Refund:
