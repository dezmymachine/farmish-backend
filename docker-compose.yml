# Local dependencies. `make db-up` starts them; `make db-down` stops them.
services:
  postgres:
    # Match Neon's major version (ADR-0009).
    image: postgres:18
    environment:
      POSTGRES_USER: farmish
      POSTGRES_PASSWORD: farmish
      POSTGRES_DB: farmish
    ports:
      # 54320 on the host avoids clashing with a locally installed Postgres.
      - "127.0.0.1:${FARMISH_PG_PORT:-54320}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmish -d farmish"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    # Local stand-in for Upstash (tests, smoke, dev without REDIS_URL pointing at Upstash).
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"] # ephemeral
    ports:
      - "127.0.0.1:${FARMISH_REDIS_PORT:-63790}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  firebase-auth:
    build: docker/firebase-emulator
    image: farmish-firebase-auth:15.31.0
    ports:
      - "127.0.0.1:${FARMISH_AUTH_EMULATOR_PORT:-9099}:9099"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9099/ >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Local stand-in for Cloudflare R2 (S3-compatible): media uploads in dev
  # and tests. Dev credentials only. rustfs replaced minio/minio because the
  # latter is no longer pullable (ADR-0016).
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.44
    # The image's entrypoint execs its command verbatim, so the binary is
    # part of the command line.
    command: ["/usr/bin/rustfs", "/data"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: farmish
      RUSTFS_SECRET_KEY: farmish-secret
    ports:
      - "127.0.0.1:${FARMISH_S3_PORT:-9000}:9000"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/ >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata18:
  s3data:

networks:
  default:
    name: farmish-backend # fixed name so scripts/smoke.sh can attach to it
