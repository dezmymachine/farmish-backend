  /v1/orders/{id}/dispute:
    post:
      tags: [orders]
      operationId: disputeOrder
      summary: Open a dispute
      description: |
        The buyer of the order only, on a shipped or delivered order and
        before auto-completion. Opening a dispute stops the 3-day
        auto-complete clock; escrow stays held until our team resolves the
        case.
      x-farmish-rate-limit: sensitive
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeOrderRequest"
