name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: go test
        run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t farmish-backend:ci .
      - name: smoke test /healthz
        run: |
          docker run -d --name api -p 8080:8080 -e APP_ENV=test -e CORS_ORIGINS=http://localhost:3000 farmish-backend:ci
          for _ in $(seq 1 20); do
            if curl -fsS localhost:8080/healthz; then exit 0; fi
            sleep 0.5
          done
          docker logs api
          exit 1
