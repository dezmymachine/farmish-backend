openapi: 3.1.0
info: {title: abuse-controls fixture, version: "1"}
security:
  - bearerAuth: []
paths:
  /plain:
    get:
      security: []
      responses: {"200": {description: ok}}
  /form:
    post:
      security: []
      x-farmish-rate-limit: sensitive
      x-farmish-turnstile: true
      responses: {"200": {description: ok}}
  /private:
    get:
      responses: {"200": {description: ok}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
