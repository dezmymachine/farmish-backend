  /v1/seller/orders/{id}/accept:
    post:
      tags: [orders]
      operationId: acceptOrder
      summary: Accept a paid order
      description: |
        The seller of the order only; anyone else gets a 404. Accepting starts
        fulfilment. A paid order that is not accepted within 48 hours
        auto-cancels with a refund.
      parameters:
        - $ref: "#/components/parameters/OrderId"
