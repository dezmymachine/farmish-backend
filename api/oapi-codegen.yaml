# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: api
output: internal/http/api/api.gen.go
generate:
  gin-server: true
  strict-server: true
  models: true
  embedded-spec: true
output-options:
  skip-prune: true # keep shared schemas (Money, PageMeta, ...) before any path uses them
compatibility:
  always-prefix-enum-values: true # ErrorDetailLocationBody, not Body
