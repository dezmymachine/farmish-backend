# Local dependencies. `make db-up` starts them; `make db-down` stops them.
services:
  postgres:
    # Match Neon's major version (ADR-0009).
    image: postgres:18
    environment:
      POSTGRES_USER: farmish
      POSTGRES_PASSWORD: farmish
      POSTGRES_DB: farmish
    ports:
      # 54320 on the host avoids clashing with a locally installed Postgres.
      - "127.0.0.1:${FARMISH_PG_PORT:-54320}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmish -d farmish"]
      interval: 2s
      timeout: 3s
      retries: 30

  firebase-auth:
    build: docker/firebase-emulator
    image: farmish-firebase-auth:15.31.0
    ports:
      - "127.0.0.1:${FARMISH_AUTH_EMULATOR_PORT:-9099}:9099"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9099/ >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  pgdata18:

networks:
  default:
    name: farmish-backend # fixed name so scripts/smoke.sh can attach to it
