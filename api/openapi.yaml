        result is validated as a whole, and changing the category re-validates
        the attributes. A suspended listing cannot be edited (409).
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingRequest"
      responses:
        "200":
          description: The updated listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [listings]
      operationId: deleteListing
      summary: Delete a draft listing
      description: Drafts only; archive anything else so its history survives (409).
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "204":
          description: The draft is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/me/listings/{id}/publish:
    post:
      tags: [listings]
      operationId: publishListing
      summary: Publish a listing
      description: Draft, archived or expired becomes active for 30 days. Needs an image and every required attribute.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: The published listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/me/listings/{id}/renew:
    post:
      tags: [listings]
      operationId: renewListing
      summary: Renew a listing
      description: Active or expired becomes active again for another 30 days.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: The renewed listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/me/listings/{id}/mark-sold:
    post:
      tags: [listings]
      operationId: markListingSold
      summary: Mark a listing as sold
      description: Active listings only (409 otherwise).
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: The sold listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/me/listings/{id}/archive:
    post:
      tags: [listings]
      operationId: archiveListing
      summary: Archive a listing
      description: Active or expired listings are hidden. Publish or renew brings it back.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: The archived listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token.
  parameters:
    ListingId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A client-generated uuid. The same key with the same payload replays
        the stored checkout; the same key with a different payload is a 409.
      schema:
        type: string
        format: uuid
    CheckoutId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ListingSlug:
      name: slug
      in: path
      required: true
      description: The listing's public slug.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but not allowed to do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource is in a state that forbids this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotModified:
      description: |
        The client's `If-None-Match` still matches, so the cached copy stands.
        Sent with no body.
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control"
        ETag:
          $ref: "#/components/headers/ETag"
    TooManyRequests:
      description: Rate limit exceeded. Retry after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds until a request will be allowed.
          schema:
            type: integer
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentProviderError:
      description: |
        The payment provider could not be reached or refused the request. No
        money moved: the buyer can retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrderActionError:
      description: |
        400 validation_failed, 403 forbidden (wrong party for this order),
        404 not found (including not a party), 409 invalid_transition (with
        `from` and `to` in the details). The body is the shared error
        envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  headers:
    Cache-Control:
      description: How long a shared cache may reuse the response.
      schema:
        type: string
    ETag:
      description: A weak validator over the exact response body.
      schema:
        type: string
    X-RateLimit-Limit:
      description: Burst capacity of the limit that applied.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests left before limiting.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Seconds until the limit is fully replenished.
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      description: The single error envelope used by every endpoint.
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable snake_case error code: `bad_request`, `validation_failed`,
            `unauthorized`, `reauth_required`, `forbidden`, `not_found`,
            `method_not_allowed`, `rate_limited`, `turnstile_failed`,
            `invalid_transition`, `seller_profile_required`,
            `listing_suspended`, `internal_error`, `unavailable`.
            `reauth_required` means the sign-in is too old for a step-up
            operation; `invalid_transition` and `listing_suspended` are
            state conflicts (409).
          examples: [validation_failed]
        message:
          type: string
          description: Human-readable summary. Do not parse.
          examples: [Request validation failed]
        details:
          type: array
          description: Per-field problems, present for `validation_failed`.
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [location, message]
      properties:
        location:
          type: string
          enum: [path, query, header, cookie, body]
        field:
          type: string
          description: Parameter name, or a JSON pointer into the body (e.g. `/items/0/qty`).
          examples: [/items/0/qty]
        message:
          type: string
          examples: [must be >= 1]
    Me:
      type: object
      description: The signed-in user's own view of their account. Never returned for other users.
      required: [id, emailVerified, signupMethod, role, sellerVerified, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Present when the Firebase account has an email.
        emailVerified:
          type: boolean
        phone:
          type: string
          description: E.164 phone number, present for phone sign-ins.
          examples: ["+233241234567"]
        displayName:
          type: string
        signupMethod:
          type: string
          enum: [social, email, phone]
        role:
          type: string
          enum: [user, admin]
        sellerVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateMeRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '\S'
          description: Leading/trailing whitespace is trimmed; must contain a non-space character.
    SellerProfileInput:
      type: object
      description: Create-or-edit model for the caller's seller profile. idType and idNumber must be given together.
      additionalProperties: false
      required: [businessName, region, district]
      properties:
        businessName:
          type: string
          minLength: 2
          maxLength: 120
        region:
          type: string
          enum: [Ahafo, Ashanti, Bono, Bono East, Central, Eastern, Greater Accra, North East, Northern, Oti, Savannah, Upper East, Upper West, Volta, Western, Western North]
        district:
          type: string
          minLength: 2
          maxLength: 80
        bio:
          type: string
          maxLength: 1000
        showPhone:
          type: boolean
        showWhatsapp:
          type: boolean
        whatsapp:
          type: string
          description: Raw input; normalised server-side to E.164 (+233 followed by 9 digits).
        idType:
          type: string
          enum: [ghana_card, passport, voters_id, drivers_license]
        idNumber:
          type: string
          minLength: 4
          maxLength: 30
          pattern: '^[A-Za-z0-9-]+$'
    SellerProfile:
      type: object
      description: The owner's view of their seller profile. Never contains the ID number, only its last 4.
      required: [businessName, region, district, showPhone, showWhatsapp, verificationStatus]
      properties:
        businessName:
          type: string
        region:
          type: string
        district:
          type: string
        bio:
          type: string
        showPhone:
          type: boolean
        showWhatsapp:
          type: boolean
        whatsapp:
          type: string
          description: E.164 number, present when the seller set one.
        verificationStatus:
          type: string
          enum: [unverified, pending, verified, rejected]
        idType:
          type: string
          enum: [ghana_card, passport, voters_id, drivers_license]
        idNumberLast4:
          type: string
          description: Masked ID number (last 4) for the owner and admins.
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
    GhanaRegion:
      type: string
      description: One of Ghana's 16 regions.
      enum: [Ahafo, Ashanti, Bono, Bono East, Central, Eastern, Greater Accra, North East, Northern, Oti, Savannah, Upper East, Upper West, Volta, Western, Western North]
    ListingCategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
    ListingSellerRef:
      type: object
      description: Just enough seller to render a result row.
      required: [name, verified]
      properties:
        name:
          type: string
          description: The seller's business name.
        verified:
          type: boolean
    ListingPromotion:
      type: object
      description: A running promotion. Only the tier is public; the rank is internal.
      required: [tier]
      properties:
        tier:
          type: string
          enum: [top, vip, diamond, enterprise]
    ListingSummary:
      type: object
      description: One row of public search or browse.
      required: [id, slug, title, price, unit, region, district, itemState, category, promoted, seller, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        unit:
          type: string
          description: The selling unit, e.g. `kg`, `bags`, `heads`.
        region:
          $ref: "#/components/schemas/GhanaRegion"
        district:
          type: string
        itemState:
          type: string
          description: The item's condition or grade, e.g. `grade_a`, `used`.
        category:
          $ref: "#/components/schemas/ListingCategoryRef"
        coverImageUrl:
          type: string
          description: The first image, if the seller added one.
        promoted:
          oneOf:
            - $ref: "#/components/schemas/ListingPromotion"
            - type: "null"
          description: Null when the listing is not promoted.
        seller:
          $ref: "#/components/schemas/ListingSellerRef"
        publishedAt:
          type: string
          format: date-time
    ListingImage:
      type: object
      required: [url, order]
      properties:
        url:
          type: string
        order:
          type: integer
          format: int32
          minimum: 0
    ListingAttribute:
      type: object
      required: [key, label, value]
      properties:
        key:
          type: string
        label:
          type: string
          description: The category's display label for this attribute.
        value:
          type: string
    ListingDeliveryOptions:
      type: object
      required: [pickup, sellerDelivery]
      properties:
        pickup:
          type: boolean
        sellerDelivery:
          type: boolean
        fee:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: The seller's delivery fee, when they offer delivery.
    ListingDetail:
      type: object
      description: |
        The public listing page. It repeats the `ListingSummary` fields
        because `seller` is the full safe projection here, then adds the
        detail a buyer needs. It never carries a phone number, an email
        address or any other contact detail: those come from the contact
        endpoint, and only when the seller opted in.
      required: [id, slug, title, price, unit, region, district, itemState, category, promoted, seller, publishedAt, description, quantityAvailable, minOrderQty, isNegotiable, deliveryOptions, images, attributes, expiresAt, favoriteCount]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        unit:
          type: string
        region:
          $ref: "#/components/schemas/GhanaRegion"
        district:
          type: string
        itemState:
          type: string
        category:
          $ref: "#/components/schemas/ListingCategoryRef"
        coverImageUrl:
          type: string
        promoted:
          oneOf:
            - $ref: "#/components/schemas/ListingPromotion"
            - type: "null"
        seller:
          $ref: "#/components/schemas/PublicSeller"
        publishedAt:
          type: string
          format: date-time
        description:
          type: string
        quantityAvailable:
          type: integer
          format: int32
          minimum: 0
        minOrderQty:
          type: integer
          format: int32
          minimum: 1
        isNegotiable:
          type: boolean
        area:
          type: string
          description: The seller's area or landmark, when given.
        deliveryOptions:
          $ref: "#/components/schemas/ListingDeliveryOptions"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ListingImage"
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/ListingAttribute"
        expiresAt:
          type: string
          format: date-time
        favoriteCount:
          type: integer
          format: int32
          minimum: 0
    ListingSearchResult:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListingSummary"
        meta:
          $ref: "#/components/schemas/PageMeta"
    ListingContact:
      type: object
      description: |
        Only the fields the seller opted into. Both are omitted when the
        seller shares neither, which is an empty object rather than an error.
      properties:
        phone:
          type: string
          description: E.164, present only when `showPhone` is set.
        whatsapp:
          type: string
          description: E.164, present only when `showWhatsapp` is set.
    PublicSeller:
      type: object
      description: Safe seller projection for anonymous callers.
      required: [userId, businessName, region, district, verified, memberSince]
      properties:
        userId:
          type: string
          format: uuid
        businessName:
          type: string
        region:
          type: string
        district:
          type: string
        bio:
          type: string
        verified:
          type: boolean
          description: True when the seller is verified.
        memberSince:
          type: string
          format: date-time
          description: When the seller's user account was created.
    SellerProfileAdmin:
      type: object
      description: The admin review view, with the owner's contact fields.
      required: [userId, businessName, region, district, showPhone, showWhatsapp, verificationStatus]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        phone:
          type: string
        businessName:
          type: string
        region:
          type: string
        district:
          type: string
        bio:
          type: string
        showPhone:
          type: boolean
        showWhatsapp:
          type: boolean
        whatsapp:
          type: string
        verificationStatus:
          type: string
          enum: [unverified, pending, verified, rejected]
        idType:
          type: string
          enum: [ghana_card, passport, voters_id, drivers_license]
        idNumberLast4:
          type: string
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
    SellerProfileAdminList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SellerProfileAdmin"
        meta:
          $ref: "#/components/schemas/PageMeta"
    VerifySellerRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          maxLength: 500
          description: Required when rejecting (1-500 characters).
    CategoryNode:
      type: object
      description: One tree node. Children carry an empty children array.
      required: [id, name, slug, sortOrder, children]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        sortOrder:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"
    CategoryDetail:
      type: object
      description: One category. For a child, group, item states, units and attributes resolve through the parent.
      required: [id, name, slug, parent, group, itemStates, units, attributes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        parent:
          type: ["object", "null"]
          required: [id, name, slug]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            slug:
              type: string
        group:
          type: string
          enum: [equipment, quality, livestock, land, service]
        itemStates:
          type: array
          items:
            type: string
        units:
          type: array
          items:
            type: string
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/CategoryAttribute"
    CategoryAttribute:
      type: object
      description: An attribute definition. The id addresses it in the admin attribute endpoints.
      required: [id, key, label, type, options, required]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, number, boolean, select, date]
        options:
          type: array
          items:
            type: string
        required:
          type: boolean
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        parentId:
          type: string
          format: uuid
        icon:
          type: string
        listingGroup:
          type: string
          enum: [equipment, quality, livestock, land, service]
        sortOrder:
          type: integer
          format: int32
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        icon:
          type: string
        sortOrder:
          type: integer
          format: int32
        isActive:
          type: boolean
    CreateAttributeRequest:
      type: object
      additionalProperties: false
      required: [key, label, type]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,40}$'
        label:
          type: string
          minLength: 1
          maxLength: 80
        type:
          type: string
          enum: [text, number, boolean, select, date]
        options:
          type: array
          items:
            type: string
        required:
          type: boolean
        sortOrder:
          type: integer
          format: int32
    UpdateAttributeRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        type:
          type: string
          enum: [text, number, boolean, select, date]
        options:
          type: array
          items:
            type: string
        required:
          type: boolean
        sortOrder:
          type: integer
          format: int32
    Locations:
      type: object
      required: [regions]
      properties:
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionDistricts"
    RegionDistricts:
      type: object
      required: [name, districts]
      properties:
        name:
          type: string
        districts:
          type: array
          items:
            type: string
    CreateUploadUrlRequest:
      type: object
      additionalProperties: false
      required: [purpose, contentType, sizeBytes]
      properties:
        purpose:
          type: string
          enum: [listing_image]
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
          description: Exact byte length of the upload (max 5 MB).
    MediaUpload:
      type: object
      description: A presigned upload plus the tracked object id.
      required: [mediaId, uploadUrl, method, headers, expiresAt, publicUrl]
      properties:
        mediaId:
          type: string
          format: uuid
          description: Pass this to the listing endpoint when the image is attached.
        uploadUrl:
          type: string
          description: Presigned PUT URL. A secret for 10 minutes; do not log.
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers the client must send exactly (Content-Type, Content-Length).
          examples:
            - Content-Type: image/jpeg
              Content-Length: "204800"
        expiresAt:
          type: string
          format: date-time
        publicUrl:
          type: string
          description: Where the object is served from once uploaded.
    ListingDelivery:
      type: object
      description: Delivery options. At least one must be true; a seller-delivery fee is required exactly when sellerDelivery is on.
      additionalProperties: false
      required: [pickup, sellerDelivery]
      properties:
        pickup:
          type: boolean
        sellerDelivery:
          type: boolean
        sellerDeliveryFee:
          $ref: "#/components/schemas/Money"
    CreateListingRequest:
      type: object
      additionalProperties: false
      required: [categorySlug, title, description, price, unit, quantityAvailable, itemState, region, district, deliveryOptions]
      properties:
        categorySlug:
          type: string
        title:
          type: string
          minLength: 5
          maxLength: 100
        description:
          type: string
          minLength: 20
          maxLength: 5000
        price:
          $ref: "#/components/schemas/Money"
          description: Price per unit, in pesewas. Currency must be GHS.
        unit:
          type: string
          description: Must be one of the category's units.
        quantityAvailable:
          type: integer
          format: int32
          minimum: 0
        minOrderQty:
          type: integer
          format: int32
          minimum: 1
          default: 1
        isNegotiable:
          type: boolean
          default: true
        itemState:
          type: string
          description: Must be one of the category's item states.
        region:
          type: string
          enum: [Ahafo, Ashanti, Bono, Bono East, Central, Eastern, Greater Accra, North East, Northern, Oti, Savannah, Upper East, Upper West, Volta, Western, Western North]
        district:
          type: string
          minLength: 2
          maxLength: 80
