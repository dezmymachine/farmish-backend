          enum: [seller_rejected, buyer_cancelled, seller_timeout, stock_unavailable, dispute_refund, dispute_partial]
        status:
          type: string
          enum: [queued, pending, processed, failed]
        failureReason:
          type: string
        paystackRefundId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
