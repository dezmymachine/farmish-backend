openapi: 3.1.0
info:
  title: Farmish API
  version: 0.1.0
  summary: Farmish Ghana agricultural marketplace API.
  description: |
    Contract-first HTTP API for Farmish. This file is the source of truth:
    Go server types are generated from it (`make generate`), and requests are
    validated against it at runtime.

    Conventions:
    - JSON properties and query parameters are camelCase.
    - Money is always integer pesewas (`Money.amount`) plus `currency: GHS`.
    - Errors use one envelope: `{"error": {"code", "message", "details?"}}`.
      `code` is a stable snake_case identifier; `message` is human-readable
      and may change.
    - List endpoints take `page` (from 1) and `limit` (1-50) and return `PageMeta`.
    - Authenticated endpoints take a Firebase ID token as `Authorization: Bearer <token>`.
      Every operation requires it unless it declares `security: []`. Missing,
      expired or invalid tokens all get the same 401 `unauthorized` envelope.
    - `x-farmish-role: admin` on an operation additionally requires the admin
      role (403 `forbidden` otherwise). The server enforces exactly what the
      spec declares.
    - `x-farmish-step-up: true` on an operation requires a fresh sign-in
      (Firebase `auth_time` within 5 minutes) verified with a revocation
      check. A stale sign-in gets 401 `reauth_required` with
      `WWW-Authenticate: Bearer error="insufficient_user_authentication"`,
      so the client knows to sign the user in again. Missing or invalid
      tokens still get the generic 401 `unauthorized`.
    - Rate limits: every request (except the health probes) is limited per
      client address, and signed-in requests per user. `x-farmish-rate-limit:
      sensitive` adds a stricter per-operation limit. Over the limit: 429
      `rate_limited` with `Retry-After`. Responses carry `X-RateLimit-Limit`,
      `X-RateLimit-Remaining` and `X-RateLimit-Reset` (seconds).
    - `x-farmish-turnstile: true` requires a Cloudflare Turnstile token in the
      `X-Turnstile-Token` header; a missing or rejected token gets 400
      `turnstile_failed`.
  contact:
    name: Farmish Ghana
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.farmish.gh
    description: Production (local development runs on http://localhost:8080)
security:
  - bearerAuth: []
tags:
  - name: system
    description: Liveness and readiness probes.
  - name: me
    description: The signed-in user's own account.
  - name: sellers
    description: Seller profiles and verification.
  - name: catalog
    description: Categories, attributes and Ghana locations.
  - name: media
    description: Presigned uploads to object storage.
  - name: listings
    description: Seller listings. Public browsing is Phase 12.
  - name: admin
    description: Admin dispute resolution and order inspection.
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      summary: Liveness probe
      description: Returns 200 while the process can serve HTTP. Checks no dependencies.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      summary: Readiness probe
      description: Returns 200 when the database answers a ping within 2 seconds, otherwise 503.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Get my account
      description: |
        Returns the signed-in user's account. The first call after a Firebase
        sign-in creates it.
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update my account
      description: Updates editable profile fields. Email and phone are managed through Firebase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/me/seller-profile:
    get:
      tags: [sellers]
      operationId: getMySellerProfile
      summary: Get my seller profile
      description: Returns the signed-in user's seller profile, or 404 when they never created one.
      responses:
        "200":
          description: The caller's seller profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: [sellers]
      operationId: updateMySellerProfile
      summary: Create or edit my seller profile
      description: |
        Creates the profile on first call, edits it afterwards. Submitting
        or changing idType/idNumber encrypts the number, stores its last 4
        and (re)submits the profile for verification. Editing other fields
        never changes the verification status.
      x-farmish-rate-limit: sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerProfileInput"
      responses:
        "200":
          description: The saved seller profile. Never contains the ID number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/sellers/{userId}:
    get:
      tags: [sellers]
      operationId: getPublicSeller
      summary: Get a seller's public profile
      description: Safe projection only, without contact, identity or account fields.
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The seller's public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSeller"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/admin/sellers:
    get:
      tags: [sellers]
      operationId: listAdminSellers
      summary: List seller profiles by verification status
      description: Admin review queue, oldest submission first.
      x-farmish-role: admin
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [unverified, pending, verified, rejected]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of seller profiles with owner contact fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProfileAdminList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/admin/sellers/{userId}/verification:
    post:
      tags: [sellers]
      operationId: verifySeller
      summary: Approve or reject a seller
      description: |
        Decides a pending profile. Approve verifies it; reject needs a
        reason. Anything not pending gets 409.
      x-farmish-role: admin
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifySellerRequest"
      responses:
        "200":
          description: The decided profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProfileAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/admin/disputes:
    get:
      tags: [admin]
      operationId: listAdminDisputes
      summary: List disputes for review
      description: |
        Open disputes oldest first. An optional status filters to open or
        resolved cases.
      x-farmish-role: admin
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DisputeStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of disputes with their orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeAdminList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/admin/disputes/{id}:
    get:
      tags: [admin]
      operationId: getAdminDispute
      summary: Get one dispute with its order
      description: The dispute plus the full order detail and its events.
      x-farmish-role: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The dispute with its order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/admin/disputes/{id}/resolve:
    post:
      tags: [admin]
      operationId: resolveDispute
      summary: Resolve a dispute
      description: |
        Refund the buyer in full, release the held escrow to the seller, or
        refund part and release the remainder. A partial resolution needs a
        refundAmount below the order's remaining escrow; the release waits
        until the partial refund is processed. Resolving twice is a 409.
      x-farmish-role: admin
      x-farmish-rate-limit: sensitive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveDisputeRequest"
      responses:
        "200":
          description: The resolved dispute with its order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/admin/orders/{id}:
    get:
      tags: [admin]
      operationId: getAdminOrder
      summary: Get one order with contacts and ledger
      description: |
        The order detail plus both parties' contact fields and the ledger
        entries posted for the order.
      x-farmish-role: admin
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The order, admin-shaped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/admin/refunds/{id}/retry:
    post:
      tags: [admin]
      operationId: retryRefund
      summary: Retry a failed refund
      description: |
        A failed refund goes back to queued and its Paystack call is
        re-enqueued. Anything not failed, or a refund refused after release,
        is a 409.
      x-farmish-role: admin
      x-farmish-rate-limit: sensitive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The re-queued refund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: List the category tree
      description: Active parents with their active children, in sort order.
      security: []
      responses:
        "200":
          description: The category tree.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/categories/{slug}:
    get:
      tags: [catalog]
      operationId: getCategory
      summary: Get one category
      description: Group, item states, units and attributes resolve through the parent for children.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The category detail.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/locations:
    get:
      tags: [catalog]
      operationId: getLocations
      summary: List Ghana regions with district suggestions
      description: The 16 regions with suggested districts (unknown districts are still accepted).
      security: []
      responses:
        "200":
          description: Regions with district suggestions.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Locations"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/admin/categories:
    post:
      tags: [catalog]
      operationId: createCategory
      summary: Create a category
      description: A parent needs a listing group; a child takes its parent's. The slug is generated unless given.
      x-farmish-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: The created category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/admin/categories/{id}:
    patch:
      tags: [catalog]
      operationId: updateCategory
      summary: Edit a category
      description: Name, icon, sort order and the active flag. The slug and group never change here.
      x-farmish-role: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/admin/categories/{id}/attributes:
    post:
      tags: [catalog]
      operationId: createCategoryAttribute
      summary: Add an attribute to a category
      description: A taken key on the same category gets 409.
      x-farmish-role: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttributeRequest"
      responses:
        "201":
          description: The created attribute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryAttribute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/admin/categories/{id}/attributes/{attributeId}:
    patch:
      tags: [catalog]
      operationId: updateCategoryAttribute
      summary: Edit an attribute
      description: Scoped to the category (an attribute of another category reads as missing).
      x-farmish-role: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attributeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttributeRequest"
      responses:
        "200":
          description: The updated attribute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryAttribute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [catalog]
      operationId: deleteCategoryAttribute
      summary: Delete an attribute
      x-farmish-role: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attributeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The attribute is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/webhooks/paystack:
    post:
      tags: [payments]
      operationId: paystackWebhook
      summary: Paystack webhook
      description: |
        Where Paystack posts payment events. The `x-paystack-signature`
        header must be a valid HMAC-SHA512 of the raw body under the secret
        key; a missing or wrong signature is a 401 and the body is never
        parsed or stored.

        Delivery is at-least-once, so every event is keyed
        `<event>:<data.id>` and a repeat is answered 200 without a second
        effect. An event Farmish does not handle is recorded and ignored. A
        rejected event (the amount or currency is not what we expected) is
        recorded and answered 200 too, because retrying it will not change
        the answer. Only an internal failure answers 5xx, so Paystack retries.
      security: []
      requestBody:
        required: true
        description: |
          Paystack's event envelope. Deliberately loose: the fields that
          matter are verified in the service, and modelling the whole payload
          here would tie the contract to a provider's internals.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: |
            Accepted. The event was processed, was a duplicate, or was ignored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/payments/{reference}:
    get:
      tags: [payments]
      operationId: getPaymentStatus
      summary: Get a payment's status
      description: |
        The caller's own payment. A reference that does not exist and one that
        belongs to somebody else both answer 404, so this cannot be used to
        discover that a reference is real.

        If the payment is still pending and old enough that the buyer should
        have finished, this asks Paystack whether the money arrived and
        settles it if so, so a lost webhook does not leave a buyer stuck.
      parameters:
        - name: reference
          in: path
          required: true
          description: The payment reference, e.g. `FMS-abc...`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/PaymentProviderError"
  /v1/promotions/configs:
    get:
      tags: [promotions]
      operationId: listPromotionConfigs
      summary: List promotion packages
      description: |
        The four active packages, in display order. Public and cacheable for
        five minutes.
      security: []
      responses:
        "200":
          description: The active promotion packages.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionConfigList"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/promotions/purchases:
    post:
      tags: [promotions]
      operationId: purchasePromotion
      summary: Buy a promotion package
      description: |
        Any authenticated buyer may purchase. The tier price is grossed up
        server-side, and the tier's current credit count is snapshotted with
        the payment. Applying the package to a listing is a separate call and
        requires owning an active listing.
      x-farmish-rate-limit: sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasePromotionRequest"
      responses:
        "201":
          description: The created payment and where to complete it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionPurchase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/PaymentProviderError"
  /v1/me/promotion-credits:
    get:
      tags: [promotions]
      operationId: getMyPromotionCredits
      summary: Get my promotion credit balance
      description: The caller's CRD balance as a positive display number.
      responses:
        "200":
          description: The balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/promotions/applications:
