      summary: Quote a cart
      description: |
        Prices a cart from server-side snapshots. Cart lines carry quantities
        only; prices, availability, activity and category relationships come
        from the database. Nothing is reserved and no checkout or order rows
        are created.
      requestBody:
        required: true
        content:
