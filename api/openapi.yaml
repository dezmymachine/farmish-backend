          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/checkout:
    post:
      tags: [checkout]
      operationId: createCheckout
      summary: Create a checkout
      description: |
        Reserves stock, creates one order per seller and one payment, and
        starts a Paystack charge. Idempotent on the `Idempotency-Key` header:
        the same key with the same payload returns the stored answer, and the
        same key with a different payload is a 409. Nothing is priced from the
        request: prices come from the server-side snapshots.
      x-farmish-rate-limit: sensitive
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutQuoteRequest"
      responses:
        "201":
          description: The checkout was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutCreated"
        "200":
          description: |
            The stored answer for this idempotency key: the checkout already
            existed with the same payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
