      responses:
        "200":
          description: The cancelled order, seller-shaped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "default":
          $ref: "#/components/responses/OrderActionError"
  /v1/seller/orders/{id}/ship:
    post:
      tags: [orders]
      operationId: shipOrder
      summary: Mark an order shipped
      description: |
        The seller of the order only. For pickup orders "shipped" means "ready
        for pickup". The optional tracking reference is shown to the buyer.
      parameters:
