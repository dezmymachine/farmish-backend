  /v1/orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get one order
      description: |
        The buyer or the seller of the order; anyone else gets a 404. The
        seller sees the recipient name, the recipient phone, the commission
        and the seller net. The buyer sees the seller's public profile and no
        commission.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The order, role-shaped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/media/upload-url:
    post:
      tags: [media]
      operationId: createMediaUploadUrl
      summary: Get a presigned upload URL
      description: |
        Returns a short-lived presigned PUT for one image. The client PUTs
        the bytes straight to object storage, sending exactly the returned
        headers: `Content-Type` and `Content-Length` are signed, so a
        different body is rejected by storage. The returned URL is a secret
        (valid 10 minutes) and must not be logged or shared.
      x-farmish-rate-limit: sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadUrlRequest"
      responses:
        "200":
          description: The presigned upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/listings:
    get:
      tags: [listings]
      operationId: searchListings
      summary: Search and browse listings
      description: |
        Active, unexpired listings, promoted ones first (DOMAIN §6) and then
        by the requested sort. Anonymous callers are allowed; the response
        never contains a seller's contact details. Cacheable for 30 seconds,
        and a matching `If-None-Match` returns 304 with no body.
      security: []
      parameters:
        - name: q
          in: query
          description: Free text, matched against the title and description.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: category
          in: query
          description: Category slug. A parent includes all its children.
          schema:
            type: string
            maxLength: 80
        - name: region
          in: query
          schema:
            $ref: "#/components/schemas/GhanaRegion"
        - name: district
          in: query
          schema:
            type: string
            maxLength: 80
        - name: minPrice
          in: query
          description: Lowest price, in pesewas.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: maxPrice
          in: query
          description: Highest price, in pesewas.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: itemState
          in: query
          schema:
            type: string
            maxLength: 40
        - name: sort
          in: query
          description: |
            `relevance` needs `q`; without it the sort falls back to `newest`.
          schema:
            type: string
            enum: [relevance, newest, price_asc, price_desc]
            default: newest
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: If-None-Match
          in: header
          description: |
            A validator from an earlier response. When it still matches, the
            server answers 304 with no body.
          schema:
            type: string
      responses:
        "200":
          description: A page of listings.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingSearchResult"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [listings]
      operationId: createListing
      summary: Create a listing
      description: |
        Creates a listing for the signed-in seller, who must have a seller
        profile (403 `seller_profile_required` otherwise). With
        `publish: true` the listing goes live in the same request and must be
        complete (at least one image, every required attribute).
      x-farmish-rate-limit: sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
      responses:
        "201":
          description: The created listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/listings/{slug}:
    get:
      tags: [listings]
      operationId: getPublicListing
      summary: Get one listing for a buyer
      description: |
        The public listing page: the summary plus the detail fields and the
        safe seller projection. A listing that is not active, or is expired,
        is a 404 so a stale link never shows a dead page. No phone, email or
        other contact detail appears here: the contact endpoint is the only
        way to see a seller's number, and only when the seller opted in.

        A view is counted asynchronously (`listings.count_view`), so this
        stays a cheap read. Cacheable for 60 seconds.
      security: []
      parameters:
        - $ref: "#/components/parameters/ListingSlug"
        - name: If-None-Match
          in: header
          description: |
            A validator from an earlier response. When it still matches, the
            server answers 304 with no body.
          schema:
            type: string
      responses:
        "200":
          description: The listing.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/listings/{id}/contact:
    post:
      tags: [listings]
      operationId: revealListingContact
      summary: Show a seller's contact details
      description: |
        Returns only the fields the seller opted into: `phone` when
        `showPhone` is set, `whatsapp` when `showWhatsapp` is. A seller who
        opted out of both gets `{}`. Asking about your own listing is a 403,
        and a listing that is not browsable is a 404. Every reveal is counted
        in the listing's `contactCount`.
      x-farmish-rate-limit: sensitive
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: The opted-in contact details; absent fields are omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingContact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/me/listings:
    get:
      tags: [listings]
      operationId: listMyListings
      summary: List my listings
      description: The signed-in seller's listings, newest first.
      parameters:
        - name: status
          in: query
          schema:
            type: string
