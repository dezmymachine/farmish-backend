    PaymentStatus:
      type: object
      description: |
        A payment as the buyer sees it. Every amount is a `Money`, so the
        client formats for display and never does arithmetic.
      required: [reference, status, charge, processingFee, base]
      properties:
        reference:
          type: string
          description: Farmish's reference for this payment.
        status:
          type: string
          enum: [pending, success, failed, abandoned]
        base:
          $ref: "#/components/schemas/Money"
          description: What Farmish nets, before the processing fee.
        processingFee:
          $ref: "#/components/schemas/Money"
          description: |
            The fee grossed onto the buyer (DOMAIN §2.2). Non-refundable.
        charge:
          $ref: "#/components/schemas/Money"
          description: What the buyer was charged, which is the base plus the fee.
        paidAt:
          type: string
          format: date-time
          description: When the money arrived. Absent until it has.
        failureReason:
          type: string
          description: Why the payment did not succeed, when it did not.
    PromotionTier:
      type: string
      description: A promotion package.
      enum: [top, vip, diamond, enterprise]
    PromotionConfig:
      type: object
      description: One promotion package as buyers see it.
      required: [tier, name, price, credits, durationDays, featured, description, features]
      properties:
        tier:
          $ref: "#/components/schemas/PromotionTier"
        name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
          description: Package price in pesewas, before the processing fee.
        credits:
          type: integer
          format: int32
          minimum: 1
        durationDays:
          type: integer
          format: int32
          minimum: 1
        featured:
          type: boolean
        description:
          type: string
        features:
          type: array
          items:
            type: string
    PromotionConfigList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PromotionConfig"
    PurchasePromotionRequest:
      type: object
      additionalProperties: false
      required: [tier]
      properties:
        tier:
          $ref: "#/components/schemas/PromotionTier"
    PromotionPurchase:
      type: object
